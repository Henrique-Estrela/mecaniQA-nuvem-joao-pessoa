apiVersion: 1

groups:
  - orgId: 1
    name: mecaniqa-health
    folder: MecaniQA
    interval: 1m
    rules:
      - uid: mecaniqa-high-cpu
        title: MecaniQA - CPU alta
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(mecaniqa_process_cpu_usage_ratio{job="mecaniqa-api"}) > 0.8
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: CPU do processo da API acima de 80% por 5 minutos.
          runbook: docs/runbooks.md#cpu-alta
        labels:
          severity: warning
      - uid: mecaniqa-high-memory
        title: MecaniQA - Memoria alta
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (mecaniqa_jvm_memory_used_bytes{job="mecaniqa-api"} / mecaniqa_jvm_memory_max_bytes{job="mecaniqa-api"}) > 0.85
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Heap da JVM acima de 85% do limite por 5 minutos.
          runbook: docs/runbooks.md#memoria-alta
        labels:
          severity: warning
      - uid: mecaniqa-sensor-error-rate
        title: MecaniQA - Taxa de erros de sensores
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (sum(rate(mecaniqa_sensor_readings_total{result="error"}[5m])) / clamp_min(sum(rate(mecaniqa_sensor_readings_total[5m])), 1)) > 0.05 and sum(rate(mecaniqa_sensor_readings_total[5m])) >= 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Mais de 5% das leituras de sensores falharam por 5 minutos.
          runbook: docs/runbooks.md#taxa-de-erros-de-sensores
        labels:
          severity: critical
      - uid: mecaniqa-sensor-success-rate
        title: MecaniQA - Sucesso no processamento
        condition: A
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (sum(rate(mecaniqa_sensor_readings_total{result="success"}[5m])) / clamp_min(sum(rate(mecaniqa_sensor_readings_total[5m])), 1)) < 0.95 and sum(rate(mecaniqa_sensor_readings_total[5m])) >= 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Menos de 95% das leituras recebidas foram processadas por 5 minutos.
          runbook: docs/runbooks.md#taxa-de-sucesso-de-sensores
        labels:
          severity: critical
